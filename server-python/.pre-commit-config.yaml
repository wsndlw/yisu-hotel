repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format check
        entry: uv run --directory server-python --frozen ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff lint
        entry: uv run --directory server-python --frozen ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run --directory server-python --frozen mypy app tests scripts
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --directory server-python --frozen pytest
        language: system
        pass_filenames: false
