  """酒店列表查询（支持城市/关键词/星级/标签/设施/状态筛选）"""
  hotels(
    """列表查询条件"""
    input: HotelListInput!
  ): HotelResults!

  """获取当前登录用户信息"""
  me: UserResult!

  """酒店日历（商户）"""
  merchantHotelCalendar(input: HotelCalendarRangeQueryInput!): HotelCalendar!

  """房型日历（商户）"""
  merchantRoomTypeCalendar(input: CalendarRangeQueryInput!): RoomTypeCalendar!

  """我的酒店列表（商户返回自己的酒店；管理员返回全量酒店）"""
  myHotels(
    """按状态筛选（可选）"""
    status: HotelStatus
  ): HotelResults!

  """查询酒店附近 POI（按距离排序）"""
  nearbyPoi(input: NearbyPoiQueryInput!): [NearbyPoiItem!]!

  """移动端 POI 列表（按城市/类型/关键词）"""
  poiList(input: PoiListQueryInput!): [PoiEntity!]!

  """房型日历（移动端）"""
  roomTypeCalendar(endDate: String!, roomTypeId: ID!, startDate: String!): RoomTypeCalendar!

  """移动端搜索酒店列表"""
  searchHotels(
    """支持城市、日期、设施等"""
    input: SearchHotelInput!
  ): HotelConnectionResult!
}

"""注册入参"""
input RegisterInput {
  """密码（至少6位）"""
  password: String!

  """角色（商户/管理员）"""
  role: UserRole!

  """用户名"""
  username: String!
}

type Result {
  code: Int!
  data: String
  message: String!
}

"""房型日历返回"""
type RoomTypeCalendar {
  days: [RoomTypeCalendarDay!]!
  roomTypeId: ID!
}

"""房型日历（按天）"""
type RoomTypeCalendarDay {
  """日期（YYYY-MM-DD）"""
  date: String!

  """价格（单位：分）"""
  price: Int!

  """库存（为空表示不限制或未知）"""
  stock: Int
}

"""房型实体"""
type RoomTypeEntity {
  """房间面积(㎡)"""
  area: Float
  basePrice: Float!

  """床型（可选）"""
  bedType: String
  createdAt: DateTime!

  """楼层"""
  floor: String

  """含早"""
  hasBreakfast: Boolean

  """有窗"""
  hasWindow: Boolean
  hotelId: String!
  id: ID!

  """房型图片（JSON 字符串）"""
  images: String

  """是否开售"""
  isOnSale: Boolean

  """可住人数（可选）"""
  maxGuests: Float
  name: String!

  """可退"""
  refundable: Boolean
  sortOrder: Float!

  """库存（可选）"""
  stock: Float
  updatedAt: DateTime!
}

"""房型运营调整入参"""
input RoomTypeOpsInput {
  """房型基础价格"""
  basePrice: Float

  """含早"""
  hasBreakfast: Boolean

  """是否开售"""
  isOnSale: Boolean

  """可退"""
  refundable: Boolean

  """库存"""
  stock: Int
}

"""房型创建/更新入参"""
input RoomTypeUpsertInput {
  """房间面积(㎡)"""
  area: Float

  """房型基础价格"""
  basePrice: Float!

  """床型（可选）"""
  bedType: String

  """楼层"""
  floor: String

  """含早"""
  hasBreakfast: Boolean

  """有窗"""
  hasWindow: Boolean

  """房型图片（JSON 字符串）"""
  images: String

  """是否开售"""
  isOnSale: Boolean

  """可住人数（可选）"""
  maxGuests: Int

  """房型名称"""
  name: String!

  """可退"""
  refundable: Boolean

  """排序（可选）"""
  sortOrder: Int

  """库存（可选）"""
  stock: Int
}

"""酒店搜索条件（移动端）"""
input SearchHotelInput {
  """床型枚举（可选）"""
  bedType: String

  """入住日期（YYYY-MM-DD）"""
  checkIn: String!

  """离店日期（YYYY-MM-DD）"""
  checkOut: String!

  """城市编码"""
  cityCode: String!

  """最大距离（公里，筛选）"""
  distanceMax: Float

  """设施ID列表（筛选）"""
  facilityIds: [String!]

  """入住人数（可选）"""
  guestCount: Int

  """关键词（酒店名/地址）"""
  keyword: String

  """用户纬度（用于距离筛选/排序）"""
  latitude: Float

  """用户经度（用于距离筛选/排序）"""
  longitude: Float

  """分页"""
  pagination: PaginationInput

  """POI ID（单选）"""
  poiId: String

  """最高价"""
  priceMax: Float

  """最低价"""
  priceMin: Float

  """排序"""
  sort: MobileHotelSort! = DEFAULT

  """星级"""
  starRating: Int
}

"""设置酒店图片入参"""
input SetHotelImagesInput {
  """酒店ID"""
  hotelId: ID!

  """图片URL列表"""
  urls: [String!]!
}

"""更新当前用户信息入参"""
input UpdateMeInput {
  """头像URL（可选）"""
  avatarUrl: String

  """新密码（可选，至少6位）"""
  password: String

  """常用设施ID（可选）"""
  preferredFacilityIds: [String!]

  """常用标签ID（可选）"""
  preferredTagIds: [String!]

  """新用户名（可选）"""
  username: String
}

"""系统用户"""
type User {
  """头像URL（可选）"""
  avatarUrl: String

  """创建时间"""
  createdAt: DateTime!

  """用户ID"""
  id: ID!

  """商户常用设施ID（用于新建酒店默认值）"""
  preferredFacilityIds: [String!]

  """商户常用标签ID（用于新建酒店默认值）"""
  preferredTagIds: [String!]

  """用户角色（商户/管理员）"""
  role: UserRole!

  """更新时间"""
  updatedAt: DateTime!

  """用户名（唯一）"""
  username: String!
}

type UserResult {
  code: Int!
  data: User
  message: String!
}

"""用户角色"""
enum UserRole {
  ADMIN
  MERCHANT
}